limit_req_zone $binary_remote_addr zone=kontent_zavod_requests:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name kontent-zavod.87-199-207-149.sslip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kontent-zavod.87-199-207-149.sslip.io;

    ssl_certificate /etc/letsencrypt/live/kontent-zavod.87-199-207-149.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kontent-zavod.87-199-207-149.sslip.io/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:KontentZavodTLS:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;

    auth_basic "Content Factory";
    auth_basic_user_file /etc/nginx/.kontent-zavod.htpasswd;
    client_max_body_size 16m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
        auth_basic off;
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:18082/api/data;
    }

    location / {
        limit_req zone=kontent_zavod_requests burst=60 nodelay;
        proxy_pass http://127.0.0.1:18082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
