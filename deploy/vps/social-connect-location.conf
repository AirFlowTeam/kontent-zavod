# Include INSIDE the existing Content Factory TLS server only.
# Other application paths retain the existing shared admin Basic Auth.
location = /robots.txt {
    auth_basic off;
    default_type text/plain;
    return 200 "User-agent: facebookexternalhit\nDisallow:\n\nUser-agent: Facebot\nDisallow:\n\nUser-agent: *\nAllow: /integration-info/\nAllow: /api-guide\nAllow: /guide/\nDisallow: /\n";
}

location ~ "^/connect/(?:[a-f0-9]{64}|oauth/(?:youtube|instagram|threads|tiktok|vk)/callback|meta/(?:instagram|threads)/(?:deauthorize|data-deletion)|meta/deletion/[a-f0-9]{64}|result/[a-f0-9]{64}|success)$" {
    auth_basic off;
    # Keep these server protections here so nginx does not inherit its blanket
    # Referrer-Policy. The app supplies strict-origin only for form pages and
    # no-referrer for OAuth redirects, callbacks, results and errors.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    access_log off;
    error_log /dev/null;
    client_max_body_size 32k;
    limit_req zone=kontent_zavod_requests burst=5 nodelay;
    limit_except GET POST { deny all; }
    proxy_pass http://127.0.0.1:18084;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 90s;
}

# Public creator instructions and factual product disclosures, never admin/API data.
location ~ "^/(?:api-guide|integration-info/(?:overview|privacy|terms|deletion))/?$" {
    auth_basic off;
    # These disclosures are public and must be readable by platform review crawlers.
    proxy_hide_header X-Robots-Tag;
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:18084;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
}
