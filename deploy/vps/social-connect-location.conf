# Include INSIDE the existing Content Factory TLS server only.
# Other application paths retain the existing shared admin Basic Auth.
location ~ "^/connect/(?:[a-f0-9]{64}|oauth/(?:instagram|threads|tiktok|vk)/callback|result/[a-f0-9]{64}|success)$" {
    auth_basic off;
    access_log off;
    error_log /dev/null;
    client_max_body_size 32k;
    limit_req zone=kontent_zavod_requests burst=5 nodelay;
    limit_except GET POST { deny all; }
    proxy_pass http://127.0.0.1:18084;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 90s;
}

# Public creator instructions and factual product disclosures, never admin/API data.
location ~ "^/(?:api-guide|integration-info/(?:overview|privacy|terms|deletion))$" {
    auth_basic off;
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:18084;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
}
